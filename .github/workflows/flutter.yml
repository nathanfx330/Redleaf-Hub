# .github/workflows/flutter.yml
name: Flutter

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.0'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Capture resolved dependency lock (temporary bootstrap)
        shell: bash
        run: |
          echo 'LOCKFILE_B64_BEGIN'
          base64 -w0 pubspec.lock
          echo
          echo 'LOCKFILE_B64_END'
      - name: Enforce committed dependency lock
        run: git diff --exit-code -- pubspec.lock
      - name: Compare cross-repository credential vault
        run: bash tool/check_shared_vault.sh nathanfx330/MLT-Player
      - name: Analyze Dart
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test --reporter expanded
